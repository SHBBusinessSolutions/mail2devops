# Baut das Add-in und veröffentlicht es auf GitHub Pages.
# Das passende Manifest liegt danach unter <Pages-URL>/manifest.xml.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node scripts/build.mjs
      - name: Manifest auf Pages-URL umschreiben
        run: |
          node scripts/set-url.mjs "${{ steps.pages.outputs.base_url }}"
          cp manifest.prod.xml dist/manifest.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
